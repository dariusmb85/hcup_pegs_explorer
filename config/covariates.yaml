# Exposure & Covariate Configuration

# Geographic resolution: "tract" or "zip5"
geo_mode: tract

# Amadeus features to extract
features:
  # HMS Smoke
  - id: hms_smoke_light
    source: hms
    var: prop_light_coverage
    agg: month
    description: "Proportion of light wilfire smoke cover"

  - id: hms_smoke_medium
    source: hms
    var: prop_med_coverage
    agg: month
    description: "Proportion of medium wilfire smoke cover"

  - id: hms_smoke_heavy
    source: hms
    var: prop_heavy_coverage
    agg: month
    description: "Proportion of heavy wilfire smoke cover"

  # PM2.5 dust concentration from merra2
  - id: pm25_dust
    source: merra2
    var: dusmass25
    agg: zip-month-year
    description: "Dust surface mass concentration, particles <2.5 μm (kg m⁻³)"

  - id: pm25_black_carbon
    source: merra2
    var: bcsmass
    agg: daily_max
    description: "Black carbon surface mass concentration (kg m⁻³)"

  # Ozone
  - id: ozone_daily_max_8hr
    source: aqs_daily_44201
    var: ozone
    agg: daily_8hr_max
    description: "Daily max 8-hour ozone (ppm)"

  # Temperature (if using gridMET or similar)
  - id: temp_min
    source: gridmet
    var: tmmn
    agg: daily
    description: "Mean temperature (°C)"

  - id: temp_max
    source: gridmet
    var: tmmx
    agg: daily
    description: "Maximum temperature (°C)"

  # Temperature
  - id: temp_maximum
    source: terra_climate
    var: tmax
    description: "Maximum temperature (°C)"

  - id: temp_minimum
    source: terra_climate
    var: tmin
    description: "Minimum temperature (°C)"


# Disease phenotype definitions (Phecodes)
phenotypes:
  asthma:
    label: "Asthma"
    phecodes: ["495"]
    description: "Asthma"

  copd:
    label: "COPD"
    phecodes: ["496", "496.1", "496.2"]
    description: "Chronic airway obstruction; Emphysema; Chronic bronchitis"

  respiratory_infection:
    label: "Respiratory Infection"
    phecodes: ["464", "465", "480", "481", "483"]
    description: "Acute sinusitis; Acute upper respiratory infections of multiple or unspecified sites; Pneumonia; Influenza; Acute bronchitis and bronchiolitis"

  cardiovascular:
    label: "Cardiovascular Disease"
    phecodes: ["411", "411.1", "411.2", "411.3", "411.4"]
    description: "Ischemic Heart Disease; Unstable angina (intermediate coronary syndrome); Myocardial infarction; Angina pectoris; Coronary atherosclerosis"

  stroke:
    label: "Stroke"
    phecodes: ["433", "433.1", "433.2", "433.3"]
    description: "Cerebrovascular disease; Occlusion and stenosis of precerebral arteries; Occlusion of cerebral arteries; Cerebral ischemia"

  diabetes:
    label: "Diabetes"
    phecodes: ["250"]
    description: "Diabetes mellitus"

  pregnancy:
    label: "Pregnancy"
    phecodes: ["634", "635", "640", "650"]
    description: "Miscarriage; stillbirth; Hemorrhage during pregnancy; childbirth and postpartum; Complications mainly related to pregnancy; Normal delivery"

  mental_health:
    label: "Mental Health"
    phecodes: ["290", "295", "296", "300"]
    description: "Delirium dementia and amnestic and other cognitive disorders; Schizophrenia and other psychotic disorders; Mood disorders; Anxiety disorders"

# Rollup aggregations (for person-month exposures)
rollup_metrics:
  - id: mean
    description: "Mean value across days"
  - id: sum
    description: "Sum of values"
  - id: max
    description: "Maximum value"
  - id: p90
    description: "90th percentile"
  - id: days_available
    description: "Number of days with non-missing data"
  - id: days_above_threshold
    description: "Days exceeding threshold"


# Thresholds for binary exposure indicators
thresholds:
  pm25_unhealthy_sensitive: 35.5  # μg/m³ (AQI orange)
  pm25_unhealthy: 55.5  # μg/m³ (AQI red)
  ozone_unhealthy_sensitive: 0.070  # ppm
  temp_heat_warning: 32  # °C (~90°F)
  temp_cold_warning: 0   # °C (32°F)

# ExWAS model specifications
exwas_models:
  # Overall - unadjusted only
  - id: logit_unadjusted_overall
    strata: all
    outcome_type: binary
    family: binomial
    formula_template: "{outcome} ~ scale({exposure})"
    description: "Unadjusted - All"

  # Overall - temporal adjusted
  - id: logit_adjusted_temporal_overall
    strata: all
    outcome_type: binary
    family: binomial
    formula_template: "{outcome} ~ scale({exposure}) + year + factor(season)"
    description: "Temporal adjusted - All"

  # Male - temporal adjusted only
  - id: logit_adjusted_temporal_male
    strata: male
    outcome_type: binary
    family: binomial
    formula_template: "{outcome} ~ scale({exposure}) + year + factor(season)"
    description: "Temporal adjusted - Males"

  # Female - temporal adjusted only
  - id: logit_adjusted_temporal_female
    strata: female
    outcome_type: binary
    family: binomial
    formula_template: "{outcome} ~ scale({exposure}) + year + factor(season)"
    description: "Temporal adjusted - Females"

# Small cell suppression rules
suppression:
  min_cell_size: 11
  apply_to:
    - counts
    - geographic_aggregates

# Privacy settings
privacy:
  person_id_hash_algorithm: sha256
  date_precision: month  # Options: day, month, year
  geographic_precision: tract  # Options: tract, zip5, county, state
